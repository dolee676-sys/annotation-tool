name: Publish v0.1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/publish-release-trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx electron-builder --win --dir --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Archive
        shell: pwsh
        run: |
          Compress-Archive -Path release/win-unpacked -DestinationPath release/zhujie-win-x64.zip -Force
          $hash = (Get-FileHash release/zhujie-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) 'release/zhujie-win-x64.zip.sha256'),
            "$hash  zhujie-win-x64.zip`n",
            [System.Text.Encoding]::ASCII
          )
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.1.3 --yes 2>$null
          gh release create v0.1.3 release/zhujie-win-x64.zip release/zhujie-win-x64.zip.sha256 --latest --title "注解 v0.1.3" --notes "Windows x64 安装包（解压即用）。更新包附带 SHA-256 校验文件。"
