name: Publish draft release

on:
  push:
    branches: [main]
    paths:
      - '.github/publish-release-trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.1.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit v0.1.3 --draft=false --latest
