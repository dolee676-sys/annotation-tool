name: Publish draft release

on:
  push:
    branches: [main]
    paths:
      - '.github/publish-release-trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download v0.1.3 --pattern 'zhujie-win-x64.zip*' --dir dist
          cd dist
          ls -l
          sha256sum -c zhujie-win-x64.zip.sha256
      - name: Publish v0.1.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit v0.1.3 --draft=false --latest
