name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx electron-builder --win --dir --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Archive
        shell: pwsh
        run: |
          Compress-Archive -Path release/win-unpacked -DestinationPath release/zhujie-win-x64.zip
          $hash = (Get-FileHash release/zhujie-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  zhujie-win-x64.zip" | Out-File -Encoding ascii release/zhujie-win-x64.zip.sha256
      - name: Draft release
        run: gh release create ${{ github.ref_name }} release/zhujie-win-x64.zip release/zhujie-win-x64.zip.sha256 --draft --title "注解 ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
