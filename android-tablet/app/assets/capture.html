<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: https:; connect-src https: http://localhost:* http://127.0.0.1:*; frame-src 'none'; object-src 'none'; base-uri 'self' file:">
  <title>注解 · 抓取</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/capture.css">
</head>
<body>
  <div class="cap">
    <div class="cap-card">
      <div class="pane-head cap-head" id="head">
        <span class="pane-icon">抓</span>
        <div class="pane-title"><b>抓取当前页面</b><small id="sub">点词注解，或拖选一段</small></div>
        <span class="model-chip small" id="model">—</span>
        <span class="mult-badge unknown" id="modelMult">—</span>
        <button class="icon-btn" id="close" aria-label="关闭">×</button>
      </div>
      <div class="cap-body">
        <div class="cap-doc-wrap" id="docWrap">
          <div class="cap-doc" id="doc"></div>
        </div>
        <aside class="cap-answer" id="answerPane">
          <div class="cap-empty" id="empty">直接点上面的词，或拖选一段，再点「注解 / 提问」。</div>
          <div class="quote" id="quote" tabindex="0" hidden></div>
          <div class="pane-meta" id="meta"></div>
          <div class="md" id="answer" tabindex="0"></div>
          <div class="pane-error" id="error" role="alert" hidden></div>
        </aside>
      </div>
      <div class="cap-foot">
        <button class="btn small" id="copy">复制</button>
        <span class="cap-status" id="status" role="status" aria-live="polite"></span>
        <div class="cap-composer">
          <input id="input" type="text" placeholder="继续追问…" autocomplete="off">
          <button class="btn primary small" id="send">发送</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sel-toolbar" id="selToolbar">
    <button data-mode="annotate">注解</button>
    <button data-mode="ask">提问</button>
  </div>
  <button class="sel-copy" id="selCopy" hidden>复制所选</button>

  <script src="js/marked.min.js"></script>
  <script src="js/purify.min.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/prompt.js"></script>
  <script src="js/core.js"></script>
  <script src="js/capture.js"></script>
</body>
</html>
