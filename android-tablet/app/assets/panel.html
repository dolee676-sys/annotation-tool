<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: https:; connect-src https: http://localhost:* http://127.0.0.1:*; frame-src 'none'; object-src 'none'; base-uri 'self' file:">
  <title>注解</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div class="panel">
    <div class="panel-card">
      <div class="pane-head">
        <span class="pane-icon" id="icon">注</span>
        <div class="pane-title"><b id="title">注解</b><small id="sub">仅选中文字</small></div>
        <span class="model-chip small" id="model">—</span>
        <span class="mult-badge unknown" id="modelMult">—</span>
        <button class="icon-btn star" id="favorite" title="收藏当前问答" aria-label="收藏当前问答" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M12 3.2l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8-5.4 2.8 1-6-4.3-4.2 6-.9L12 3.2z" />
          </svg>
        </button>
        <button class="icon-btn pin" id="pin" title="钉在当前屏幕上" aria-label="钉住" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6z" />
            <path d="M12 14v7" />
          </svg>
        </button>
        <button class="icon-btn" id="close" aria-label="关闭">×</button>
      </div>
      <div class="panel-scroll" id="scroll">
        <div class="quote" id="quote" tabindex="0"></div>
        <div class="pane-meta" id="meta"></div>
        <div class="md" id="answer" tabindex="0"></div>
        <div class="panel-empty" id="empty">选中文字已带上，直接问你想知道的。</div>
        <div class="pane-error" id="error" role="alert" hidden></div>
        <div class="setup" id="setup" hidden>
          <p>还没填 API Key。</p>
          <p class="note">打开「注解」应用，在设置里粘贴 Key，再回来。</p>
          <button class="btn primary small" id="goSettings">去设置</button>
        </div>
      </div>
      <div class="panel-actions">
        <button class="btn small" id="copy">复制</button>
        <span class="grow"></span>
        <span class="usage" id="usage"></span>
      </div>
      <div class="composer">
        <input id="input" type="text" placeholder="继续追问…" autocomplete="off">
        <button class="btn primary small" id="send">发送</button>
      </div>
    </div>
    <button class="sel-copy" id="selCopy" hidden>复制所选</button>
  </div>

  <script src="js/marked.min.js"></script>
  <script src="js/purify.min.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/prompt.js"></script>
  <script src="js/core.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
